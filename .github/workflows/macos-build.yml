name: Build J.A.R.V.I.S. for macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          swift --version
          xcodebuild -version

      - name: Build universal macOS app
        run: |
          set -euo pipefail
          APP="J.A.R.V.I.S..app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          swiftc -O -target arm64-apple-macos13.0 macOS/JarvisApp.swift \
            -o /tmp/Jarvis-arm64 \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Speech

          swiftc -O -target x86_64-apple-macos13.0 macOS/JarvisApp.swift \
            -o /tmp/Jarvis-x86_64 \
            -framework SwiftUI -framework AppKit -framework AVFoundation -framework Speech

          lipo -create /tmp/Jarvis-arm64 /tmp/Jarvis-x86_64 -output "$APP/Contents/MacOS/Jarvis"

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>Jarvis</string>
            <key>CFBundleIdentifier</key><string>com.harshit.jarvis</string>
            <key>CFBundleName</key><string>J.A.R.V.I.S.</string>
            <key>CFBundleDisplayName</key><string>J.A.R.V.I.S.</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSMicrophoneUsageDescription</key><string>J.A.R.V.I.S. uses the microphone for clap and voice activation.</string>
            <key>NSSpeechRecognitionUsageDescription</key><string>J.A.R.V.I.S. uses speech recognition to understand your commands.</string>
          </dict>
          </plist>
          PLIST

          printf 'APPL????' > "$APP/Contents/PkgInfo"
          ditto -c -k --sequesterRsrc --keepParent "$APP" JARVIS-macOS-App.zip

      - name: Validate backend JavaScript syntax
        run: |
          node --check api/chat.js
          node --check api/speak.js
          node --check api/health.js

      - name: Upload installable app bundle
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-macOS-App
          path: JARVIS-macOS-App.zip
          if-no-files-found: error
          retention-days: 30
